<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanvasPlay</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=ink_pen,ink_eraser,crop_square,brush,download" />
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=ink_pen,ink_eraser,crop_square,brush,download" /> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="heading">CanvasPlay</h1>
    <div id="tools">
    <div class="colorInput">
        <label for="strokeColor">Color</label>
        <input id="strokeColor" type="color" value="#000000"/>
    </div>
    <div class="brushSizeInput">
        <label for="brushSize">Size</label>
        <input id="brushSize" type="range" value="5" min="1" max="50"/>
    </div>

    <button class="button activeBtn" id="pen"><span class="material-symbols-outlined">ink_pen</span>Pen</button>
    <button class="button" id="eraser"><span class="material-symbols-outlined">ink_eraser</span>Eraser</button>
    <button class="button" id="square"><span class="material-symbols-outlined">crop_square</span>Draw Square</button>
    <button class="button" id="cleanup"><span class="material-symbols-outlined">brush</span>Full Screen Cleanup</button>
    <button class="button" id="downloadImage"><span class="material-symbols-outlined">download</span>Download Image</button>
    </div>

    <canvas id="canvas"></canvas>
</body>
<script src="./script.js"></script>
</html>
